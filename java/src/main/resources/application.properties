quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${DB_PATH:data/app.db}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.mapping.timezone.default-storage=normalize-utc
quarkus.rest-client.ping.follow-redirects=true
quarkus.rest-client.ping.max-redirects=2
quarkus.rest-client.ping.url=${ping.host:1.1.1.1}
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=26.13.0
quarkus.quinoa.package-manager-install.npm-version=11.20.0
# ---
# dev
%dev.ping.host=https://one.one.one.one
%dev.ping.interval-seconds=2
%dev.ping.threshold-seconds=20
# ---
# prod
%prod.ping.host=1.1.1.1
%prod.ping.interval-seconds=5
%prod.ping.threshold-seconds=20
%prod.quarkus.datasource.jdbc.url=jdbc:sqlite:/app/app.db
